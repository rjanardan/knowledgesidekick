<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" role="img" aria-label="Knowledge Sidekick logo">
  <defs>
    <style>
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .kmark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing:-0.01em; }
    </style>
  </defs>

  <!-- KS badge -->
  <rect x="6" y="10" width="88" height="88" rx="18" fill="#2563eb"/>
  <text x="50" y="62" text-anchor="middle" class="badge" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1.5" dominant-baseline="middle">KS</text>
  <!-- lamp dot accent (ties back to favicon) -->
  <circle cx="76" cy="22" r="5.5" fill="#ffffff"/>

  <!-- Wordmark: Knowledge (bold) -->
  <text x="110" y="58" class="word" font-size="52" font-weight="650" fill="#1c1a17">Knowledge</text>
  <!-- Wordmark: Sidekick (regular, muted) -->
  <text x="110" y="104" class="word" font-size="52" font-weight="400" fill="#5b574f">Sidekick</text>
</svg>
