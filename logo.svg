<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" role="img" aria-label="Knowledge Sidekick">
  <!-- square, color controlled by CSS currentColor on the <img> -->
  <rect x="1" y="1" width="52" height="52" rx="11" fill="currentColor"/>
  <!-- KS letters: always white on the colored square -->
  <text x="27" y="34" text-anchor="middle" dominant-baseline="central"
        font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-1.5">KS</text>
</svg>
